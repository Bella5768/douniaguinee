<div class="modal fade" id="rapportModal" tabindex="-1" aria-labelledby="rapportModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <!-- Header -->
      <div class="modal-header border-0 text-white" style="background:#003366;border-radius:16px 16px 0 0;">
        <h5 class="modal-title fw-bold" id="rapportModalLabel">
          <i class="bi bi-file-earmark-pdf me-2"></i>Rapport DounIA 1 — Téléchargement
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- Body -->
      <div class="modal-body p-0">
        <div class="row g-0">

          <!-- Colonne image de couverture -->
          <div class="col-md-4 d-flex align-items-stretch">
            {% if config.rapport_image %}
            <img src="{{ config.rapport_image.url }}" alt="Page de garde du rapport" style="width:100%;object-fit:cover;border-radius:0 0 0 16px;min-height:260px;">
            {% else %}
            <div class="d-flex flex-column align-items-center justify-content-center w-100 h-100 p-4" style="background:#f0f4f8;border-radius:0 0 0 16px;min-height:260px;">
              <i class="bi bi-file-earmark-pdf" style="font-size:4rem;color:#003366;"></i>
              <span class="text-muted mt-2 small text-center">Rapport DounIA 1</span>
            </div>
            {% endif %}
          </div>

          <!-- Colonne formulaire -->
          <div class="col-md-8 p-4">

            <form id="downloadForm" method="post" action="{% url 'rapport_download' %}">
              {% csrf_token %}
              <div class="row g-3">
                <div class="col-6">
                  <label for="download_nom" class="form-label fw-semibold" style="color:#003366;">Nom <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="download_nom" name="nom" required placeholder="Votre nom">
                </div>
                <div class="col-6">
                  <label for="download_prenom" class="form-label fw-semibold" style="color:#003366;">Prénoms <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="download_prenom" name="prenom" required placeholder="Votre prénom">
                </div>
                <div class="col-12">
                  <label for="download_email" class="form-label fw-semibold" style="color:#003366;">Email <span class="text-danger">*</span></label>
                  <input type="email" class="form-control" id="download_email" name="email" required placeholder="exemple@email.com">
                </div>
                <div class="col-12">
                  <label for="download_institution" class="form-label fw-semibold" style="color:#003366;">Institution <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="download_institution" name="institution" required placeholder="Votre organisation">
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer border-0 bg-light" style="border-radius:0 0 16px 16px;">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="bi bi-x-lg me-1"></i>Fermer
        </button>
        <button type="submit" form="downloadForm" class="btn text-white fw-bold" style="background:#003366;border-radius:8px;padding:.75rem 2rem;">
          <i class="bi bi-download me-2"></i>Télécharger le rapport
        </button>
      </div>
    </div>
  </div>
</div>
